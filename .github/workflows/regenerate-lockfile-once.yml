name: regenerate-lockfile-once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    if: contains(github.event.head_commit.message, 'fix(ci): synchronize Next.js lockfile versions')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile
        run: npm install --package-lock-only --legacy-peer-deps
      - name: Commit regenerated lockfile and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/regenerate-lockfile-once.yml
          git commit -m "fix(ci): regenerate npm lockfile"
          git push origin HEAD:main
