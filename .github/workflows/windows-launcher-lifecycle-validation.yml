name: Windows launcher full lifecycle validation

# One-shot, manual Windows package + installation test. This is deliberately
# not triggered by ordinary pushes or pull requests.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-launcher-lifecycle:
    name: Build and exercise installed OmniKes launcher
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/omnikes_build
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build Windows offline package from selected branch
        shell: powershell
        run: npm run package:windows

      - name: Run complete Windows installation and launcher lifecycle
        shell: powershell
        run: |
          $setup = Get-ChildItem 'dist\installer\OmniKes-Setup-*-x64.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'Windows Setup executable was not produced.' }
          & "$PWD\scripts\test-windows-installer-lifecycle.ps1" -SetupExe $setup.FullName

      - name: Upload installer lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OmniKes-Windows-Launcher-Lifecycle-Diagnostics
          path: |
            ${{ runner.temp }}\omnikes-installer-lifecycle.log
            ${{ runner.temp }}\omnikes-uninstall-*.log
            ${{ runner.temp }}\omnikes-uninstall-diagnostics\**
          if-no-files-found: warn
          retention-days: 14
