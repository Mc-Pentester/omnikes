name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: omnikes_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d omnikes_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/omnikes_ci
      SESSION_SECRET: ci-runtime-session-secret-0123456789abcdef0123456789abcdef
      SEED_PASSWORD_A: ci-seed-password-admin-a-2026
      SEED_PASSWORD_CASHIER_A: ci-seed-password-cashier-a-2026
      SEED_PASSWORD_B: ci-seed-password-admin-b-2026

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # Validate that package-lock.json is installable with standard npm ci.
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: TypeScript type check
        run: npm run typecheck

      - name: Dependency vulnerability audit (production)
        continue-on-error: true
        run: npm audit --omit=dev

      - name: Apply PostgreSQL migrations
        run: npx prisma migrate deploy

      - name: Seed PostgreSQL test database
        run: npx ts-node prisma/seed.ts

      - name: Run real PostgreSQL runtime proof
        run: npx vitest run --config vitest.integration.config.ts src/tests/integration/sale-credit.postgres.test.ts src/tests/integration/sale-credit.api.postgres.test.ts

      - name: Run tests
        run: npm test

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1

            mapfile -t changed_files < <(
              git diff --name-only "origin/${{ github.base_ref }}...HEAD" --                 '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs'
            )

            if [ "${#changed_files[@]}" -eq 0 ]; then
              echo "No lintable files changed in this pull request."
            else
              echo "Linting changed files only:"
              printf ' - %s\n' "${changed_files[@]}"
              npx eslint "${changed_files[@]}"
            fi
          else
            npm run lint
          fi

      - name: Build
        # Trigger verification run after the weighted-pricing test fix.
        run: npm run build
