name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: omnikes_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d omnikes_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/omnikes_ci
      SESSION_SECRET: ci-runtime-session-secret-0123456789abcdef0123456789abcdef
      SEED_PASSWORD_A: ci-seed-password-admin-a-2026
      SEED_PASSWORD_CASHIER_A: ci-seed-password-cashier-a-2026
      SEED_PASSWORD_B: ci-seed-password-admin-b-2026

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PostgreSQL 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          echo | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/18/bin:$PATH"

          echo "pg_dump: $(pg_dump --version)"
          echo "pg_restore: $(pg_restore --version)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # Validate that package-lock.json is installable with standard npm ci.
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: TypeScript type check
        run: npm run typecheck

      - name: Dependency vulnerability audit (production)
        # Production dependency vulnerabilities must block the release gate.
        run: npm audit --omit=dev

      - name: Apply PostgreSQL migrations
        run: npx prisma migrate deploy

      - name: Seed PostgreSQL test database
        run: npx ts-node prisma/seed.ts

      - name: Run real PostgreSQL runtime proof
        run: npx vitest run --config vitest.integration.config.ts --no-file-parallelism src/tests/integration/sale-credit.postgres.test.ts src/tests/integration/sale-credit.api.postgres.test.ts src/tests/integration/cash-management.postgres.test.ts src/tests/integration/pos-cash-e2e.postgres.test.ts src/tests/integration/local-backup-restore.postgres.test.ts

      - name: Run tests
        run: npm test

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1

            mapfile -t changed_files < <(
              git diff --name-only "origin/${{ github.base_ref }}...HEAD" --                 '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs'
            )

            if [ "${#changed_files[@]}" -eq 0 ]; then
              echo "No lintable files changed in this pull request."
            else
              echo "Linting changed files only:"
              printf ' - %s\n' "${changed_files[@]}"
              npx eslint "${changed_files[@]}"
            fi
          else
            npm run lint
          fi

      - name: Build
        # P2-06 validation trigger: dependency audit and full CI proof.
        run: npm run build


  local_first_bootstrap:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/omnikes_bootstrap_ci
      OMNIKES_BOOTSTRAP_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/omnikes_bootstrap_ci
      OMNIKES_INSTALL_ORGANIZATION_NAME: "CI Bootstrap Organization"
      OMNIKES_INSTALL_ADMIN_EMAIL: "bootstrap-admin@omnikes.local"
      OMNIKES_INSTALL_ADMIN_NAME: "CI Bootstrap Admin"
      OMNIKES_INSTALL_ADMIN_PASSWORD: "ci-bootstrap-admin-password-2026"
      OMNIKES_INSTALL_STORE_NAME: "CI Bootstrap Store"
      OMNIKES_INSTALL_STORE_CODE: "CI-BOOTSTRAP"
      OMNIKES_INSTALL_COUNTRY: "HT"
      OMNIKES_INSTALL_CURRENCY: "HTG"
      OMNIKES_INSTALL_LOCALE: "fr-HT"
      OMNIKES_INSTALL_TIMEZONE: "America/Port-au-Prince"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Local-First bootstrap E2E
        run: npm run bootstrap:local

      - name: Verify Local-First bootstrap result
        shell: bash
        run: |
          set -euo pipefail

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            organization_count integer;
            store_count integer;
            user_count integer;
            admin_role_count integer;
            permission_count integer;
            user_role_count integer;
            audit_count integer;
            cloud_enabled boolean;
            online_store_enabled boolean;
          BEGIN
            SELECT count(*) INTO organization_count FROM organizations;
            SELECT count(*) INTO store_count FROM stores;
            SELECT count(*) INTO user_count
              FROM users
              WHERE email = 'bootstrap-admin@omnikes.local';
            SELECT count(*) INTO admin_role_count
              FROM roles
              WHERE name = 'ADMIN'
                AND "isGlobal" = false;
            SELECT count(*) INTO permission_count FROM permissions;
            SELECT count(*) INTO user_role_count
              FROM user_roles ur
              JOIN users u ON u.id = ur."userId"
              JOIN roles r ON r.id = ur."roleId"
              WHERE u.email = 'bootstrap-admin@omnikes.local'
                AND r.name = 'ADMIN';
            SELECT count(*) INTO audit_count
              FROM audit_logs
              WHERE action = 'LOCAL_INSTALLATION_COMPLETED';
            SELECT "cloudEnabled", "onlineStoreEnabled"
              INTO cloud_enabled, online_store_enabled
              FROM organizations
              LIMIT 1;

            IF organization_count <> 1 THEN
              RAISE EXCEPTION 'Expected exactly 1 organization, got %', organization_count;
            END IF;
            IF store_count <> 1 THEN
              RAISE EXCEPTION 'Expected exactly 1 store, got %', store_count;
            END IF;
            IF user_count <> 1 THEN
              RAISE EXCEPTION 'Bootstrap admin was not created';
            END IF;
            IF admin_role_count <> 1 THEN
              RAISE EXCEPTION 'Expected exactly 1 organization ADMIN role, got %', admin_role_count;
            END IF;
            IF permission_count < 1 THEN
              RAISE EXCEPTION 'No permissions were provisioned';
            END IF;
            IF user_role_count <> 1 THEN
              RAISE EXCEPTION 'Bootstrap admin is not assigned to ADMIN role';
            END IF;
            IF audit_count <> 1 THEN
              RAISE EXCEPTION 'Expected LOCAL_INSTALLATION_COMPLETED audit entry, got %', audit_count;
            END IF;
            IF cloud_enabled IS DISTINCT FROM false THEN
              RAISE EXCEPTION 'Cloud must be disabled after local bootstrap';
            END IF;
            IF online_store_enabled IS DISTINCT FROM false THEN
              RAISE EXCEPTION 'Online store must be disabled after local bootstrap';
            END IF;
          END $$;
          SQL

          echo "LOCAL-FIRST BOOTSTRAP E2E: PASS"
