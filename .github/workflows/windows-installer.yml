name: Windows offline installer

# The Windows installer is expensive to build. Run it only on demand or
# when a release is published, never for ordinary pushes or pull requests.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag to build and publish (for example v1.0.0)"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/omnikes_build
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      # Reject malformed input before any tag lookup or checkout.
      - name: Validate release tag format
        shell: powershell
        run: |
          $tag = $env:RELEASE_TAG.Trim()
          if ($tag -cnotmatch '^[vV][0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag '$tag'. Expected a version such as v1.0.0."
          }
          # Git refs are case-sensitive even though PowerShell's default regex
          # operators are not. Normalize once for validation, checkout, and publish.
          $tag = $tag.ToLowerInvariant()
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "RELEASE_TAG=$tag`n", [System.Text.UTF8Encoding]::new($false))
          Write-Host "Normalized release tag: $tag"

      - name: Checkout main for release validation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release tag and successful main CI
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          git fetch origin main --tags --force
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch main and release tags." }

          $tagCommit = (git rev-list -n 1 $tag).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $tagCommit) { throw "Release tag '$tag' does not resolve to a commit." }

          git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag '$tag' is not on the current main history. Publish only validated main commits."
          }

          $runsJson = gh run list --workflow ci.yml --commit $tagCommit --json conclusion,status,databaseId --limit 20
          if ($LASTEXITCODE -ne 0) { throw "Could not verify GitHub Actions CI for commit $tagCommit." }
          $runs = @($runsJson | ConvertFrom-Json)
          $successfulRun = $runs | Where-Object { $_.status -eq "completed" -and $_.conclusion -eq "success" } | Select-Object -First 1
          if (-not $successfulRun) {
            throw "No successful CI run for commit $tagCommit. Release build blocked."
          }

          Write-Host "Release tag: $tag"
          Write-Host "Release commit: $tagCommit"
          Write-Host "Validated CI run: $($successfulRun.databaseId)"

      - name: Checkout validated release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build Windows offline installer
        shell: powershell
        run: npm run package:windows

      - name: Verify Prisma packaging
        shell: powershell
        run: npm test -- src/tests/build/prisma-packaging-verification.test.ts

      - name: Verify launcher configuration
        shell: powershell
        run: npm test -- src/tests/build/launcher-verification.test.ts

      - name: Verify Windows in-place upgrade safety
        shell: powershell
        run: npm test -- src/tests/build/windows-in-place-upgrade.test.ts

      - name: Inspect and reject repository documentation in package
        shell: powershell
        run: |
          $app = Join-Path $PWD "dist\\windows\\app"
          if (-not (Test-Path $app)) { throw "Packaged application directory is missing." }

          Write-Host "=== Application package root ==="
          Get-ChildItem $app -Force | Select-Object Mode, Name

          # Only repository-level documentation directories are forbidden.
          # Nested app routes and third-party vendor documentation are legitimate.
          $forbiddenDirectories = @("docs", "audit", "reports", "report", "rapports", "rapport")
          $leakedDirectories = Get-ChildItem $app -Directory -ErrorAction SilentlyContinue |
            Where-Object { $forbiddenDirectories -contains $_.Name.ToLowerInvariant() }
          if ($leakedDirectories) {
            $names = ($leakedDirectories | ForEach-Object { $_.FullName }) -join ", "
            throw "Repository documentation directories leaked into package: $names"
          }

          # Reject only report/audit text artifacts at the package root.
          $leakedFiles = Get-ChildItem $app -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match '(?i)(audit|report|rapport|diagnostic|forensic|remediation|analysis|analyse)' -and
              $_.Extension -match '(?i)^\\.(md|txt|log|csv|pdf|html)$'
            }
          if ($leakedFiles) {
            $names = ($leakedFiles | ForEach-Object { $_.FullName }) -join ", "
            throw "Repository audit/report files leaked into package: $names"
          }

          $rootMarkdown = @(Get-ChildItem $app -File -Filter "*.md" -ErrorAction SilentlyContinue)
          if ($rootMarkdown.Count -gt 0) {
            $names = ($rootMarkdown | ForEach-Object { $_.Name }) -join ", "
            throw "Repository Markdown files leaked into application root: $names"
          }

          Write-Host "Package documentation and audit/report exclusion checks: PASS"

      - name: Verify production package excludes development lint chain
        shell: powershell
        run: |
          $app = Join-Path $PWD "dist\\windows\\app"
          if (-not (Test-Path (Join-Path $app "server.js"))) {
            throw "Standalone server.js is missing from the packaged application."
          }
          foreach ($package in @("eslint-config-next", "@next\\eslint-plugin-next")) {
            $packagePath = Join-Path $app ("node_modules\\" + $package)
            if (Test-Path $packagePath) {
              throw "Development-only package was included in the distributed application: $package"
            }
          }
          npm audit --omit=dev --prefix $app
          $installer = Get-ChildItem "dist\\installer\\OmniKes-Setup-*-x64.exe" -File
          if (-not $installer) {
            throw "The Inno Setup executable was not produced."
          }
          $installer | ForEach-Object { Write-Host "Installer: $($_.FullName) ($($_.Length) bytes)" }

      - name: Verify Windows install, first-store creation, in-place upgrade, and uninstall
        shell: powershell
        run: |
          $installer = Get-ChildItem "dist\installer\OmniKes-Setup-*-x64.exe" -File | Select-Object -First 1
          if (-not $installer) {
            throw "The Windows lifecycle test cannot find the generated installer."
          }
          & "$PWD\scripts\test-windows-installer-lifecycle.ps1" -SetupExe $installer.FullName

      - name: Collect Windows uninstall diagnostics
        if: always()
        shell: powershell
        run: |
          $diagnosticDir = Join-Path $env:RUNNER_TEMP "omnikes-uninstall-diagnostics"
          New-Item -ItemType Directory -Path $diagnosticDir -Force | Out-Null
          $sources = @(
            (Join-Path $env:RUNNER_TEMP "omnikes-installer-lifecycle.log"),
            (Join-Path $env:RUNNER_TEMP "omnikes-uninstall-normal-inno.log"),
            (Join-Path $env:RUNNER_TEMP "omnikes-uninstall-purge-inno.log"),
            (Join-Path $env:ProgramData "OmniKes\logs\runtime-install.log")
          )
          foreach ($source in $sources) {
            if (Test-Path -LiteralPath $source) {
              Copy-Item -LiteralPath $source -Destination $diagnosticDir -Force
              Write-Host "=== $source ==="
              Get-Content -LiteralPath $source -Tail 300
            } else { Write-Host "DIAGNOSTIC FILE NOT FOUND: $source" }
          }
          $installDir = Join-Path $env:RUNNER_TEMP "OmniKes-Lifecycle-Test"
          if (Test-Path -LiteralPath $installDir) {
            Get-ChildItem -LiteralPath $installDir -Force -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1000 FullName, Length, Attributes |
              Format-Table -AutoSize | Out-String -Width 4096 |
              Set-Content -LiteralPath (Join-Path $diagnosticDir "remaining-install-files.txt")
          } else { "Install directory absent." | Set-Content -LiteralPath (Join-Path $diagnosticDir "remaining-install-files.txt") }
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @("node.exe", "postgres.exe", "omnikes.exe") } |
            Select-Object ProcessId, ParentProcessId, Name, ExecutablePath, CommandLine |
            Format-List | Out-String -Width 4096 |
            Set-Content -LiteralPath (Join-Path $diagnosticDir "processes-after-uninstall.txt")
          # sc.exe returns 1060 when the service has been removed. That is
          # the expected post-uninstall state, not a diagnostics failure.
          $serviceOutput = & "$env:WINDIR\System32\sc.exe" queryex OmniKesPostgreSQL 2>&1
          $serviceExitCode = $LASTEXITCODE
          $serviceDiagnostic = @($serviceOutput | ForEach-Object { "$_" })
          if ($serviceExitCode -eq 1060) {
            $serviceDiagnostic += "Expected result: OmniKesPostgreSQL is not installed (sc.exe exit 1060)."
          } elseif ($serviceExitCode -ne 0) {
            $serviceDiagnostic += "WARNING: sc.exe queryex returned unexpected exit code $serviceExitCode."
            Write-Warning "Could not query OmniKesPostgreSQL after uninstall (sc.exe exit $serviceExitCode)."
          }
          $serviceDiagnostic |
            Set-Content -LiteralPath (Join-Path $diagnosticDir "postgres-service-after-uninstall.txt")

          # GitHub Actions appends "exit $LASTEXITCODE" to built-in PowerShell
          # steps. sc.exe uses 1060 to report the expected absent-service state
          # after uninstall, so clear its native exit code after recording it.
          # Unexpected sc.exe errors are retained in the diagnostic file and
          # warned above; diagnostic collection itself must still complete.
          $global:LASTEXITCODE = 0
          Write-Host "Diagnostics directory: $diagnosticDir"
          Write-Host "Windows uninstall diagnostics collection: PASS"

      - name: Upload Windows installer lifecycle diagnostics
        id: upload-lifecycle-diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: OmniKes-Windows-Uninstall-Diagnostics
          path: ${{ runner.temp }}/omnikes-uninstall-diagnostics/**
          if-no-files-found: warn
          retention-days: 3

      - name: Upload Windows installer
        id: upload-windows-installer-artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: OmniKes-Windows-Offline-Installer
          path: dist/installer/OmniKes-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 3
      - name: Summarize optional workflow artifact uploads
        if: always()
        shell: powershell
        env:
          DIAGNOSTICS_OUTCOME: ${{ steps.upload-lifecycle-diagnostics.outcome }}
          INSTALLER_ARTIFACT_OUTCOME: ${{ steps.upload-windows-installer-artifact.outcome }}
        run: |
          $failedUploads = @()
          if ($env:DIAGNOSTICS_OUTCOME -eq "failure") { $failedUploads += "uninstall diagnostics" }
          if ($env:INSTALLER_ARTIFACT_OUTCOME -eq "failure") { $failedUploads += "installer workflow artifact" }
          if ($failedUploads.Count -gt 0) {
            $message = "WARNING: GitHub Actions artifact storage prevented upload of: $($failedUploads -join ", "). Build and lifecycle checks are evaluated independently. The release asset upload remains a required step."
            Write-Warning $message
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("## Optional workflow artifacts unavailable`n`n" + $message)
          } else {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## Workflow artifacts`n`nInstaller and lifecycle diagnostics were uploaded successfully."
          }

      - name: Publish installer and SHA-256 to public distribution repository
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG
          $releaseRepo = "Mc-Pentester/omnikes-releases"
          if (-not $env:GH_TOKEN) {
            throw "RELEASES_TOKEN is required to publish to $releaseRepo."
          }
          $installer = Get-ChildItem "dist\installer\OmniKes-Setup-*-x64.exe" -File | Select-Object -First 1
          if (-not $installer -or $installer.Length -le 0) {
            throw "A non-empty Windows installer is required before publishing."
          }

          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$($installer.FullName).sha256"
          "$hash  $($installer.Name)" | Set-Content -LiteralPath $checksumPath -Encoding ascii

          $releasesJson = gh release list --repo $releaseRepo --limit 100 --json tagName,isDraft
          if ($LASTEXITCODE -ne 0) { throw "Could not list releases in $releaseRepo." }
          $releases = @($releasesJson | ConvertFrom-Json)
          $release = $releases | Where-Object { $_.tagName -eq $tag } | Select-Object -First 1
          $publishAfterUpload = $false

          if (-not $release) {
            # The distribution repository contains no application source. Its
            # release tag is created on its README-only main branch.
            gh release create $tag --repo $releaseRepo --target main --draft --title "OmniKes $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Could not create draft release '$tag' in $releaseRepo." }
            $publishAfterUpload = $true
          } elseif ($release.isDraft) {
            $publishAfterUpload = $true
          } else {
            Write-Host "Release '$tag' already exists in $releaseRepo; attaching installer assets."
          }

          gh release upload $tag $installer.FullName $checksumPath --repo $releaseRepo --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload installer assets to $releaseRepo release '$tag'." }

          if ($publishAfterUpload) {
            gh release edit $tag --repo $releaseRepo --draft=false --title "OmniKes $tag"
            if ($LASTEXITCODE -ne 0) { throw "Assets uploaded, but release '$tag' could not be published. Inspect the draft before retrying." }
          }

          Write-Host "Public release: https://github.com/$releaseRepo/releases/tag/$tag"
          Write-Host "Installer: $($installer.Name)"
          Write-Host "SHA-256: $hash"
