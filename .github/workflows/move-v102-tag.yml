
name: Move v1.0.2 tag

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Move tag to corrected commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH \
            repos/${{ github.repository }}/git/refs/tags/v1.0.2 \
            -f sha=f0d639a2cdf9a1934a562957b1066e40527120b4 \
            -F force=true
